org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

mod_id=infectiouspatch
mod_name=Infectious Patch
mod_version=1.0.3
mod_group_id=com.rinkynooble.infectiouspatch
mod_authors=RinkyNooble
mod_license=0BSD
mod_description=Makes the enableLootdrops gamerule work, removes Infectious' hardcoded mob drops so loot tables decide them, and keeps Infectious zombies from spawners, commands and spawn eggs in lit places. An unofficial companion patch for Infectious by Zcoper, not affiliated with it.
mod_url=https://github.com/RinkyDinkyNooble/infectiouspatch
mod_issues=https://github.com/RinkyDinkyNooble/infectiouspatch/issues

minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.10
forge_version_range=[47,)
loader_version_range=[47,)

# The Infectious jar in libs/ that this is compiled against: Infectious-forge-1_20_1-1_7.jar (Infectious 1.7).
infectious_jar=Infectious-forge-1_20_1:1_7
# Infectious 1.7 declares its version as 1.0.0, so a range can't tell its builds apart.
# The startup log ("Patched ...: N of M changes applied.") shows whether a build matches.
infectious_version_range=[1.0.0,)
